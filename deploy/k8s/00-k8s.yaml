apiVersion: v1
kind: Namespace
metadata: { name: djproj }
---
apiVersion: v1
kind: Secret
metadata: { name: rabbitmq-conn, namespace: djproj }
type: Opaque
stringData:
  broker_url: amqp://guest:guest@rabbitmq:5672//
---
apiVersion: v1
kind: ConfigMap
metadata: { name: djproj-env, namespace: djproj }
data:
  CHANNEL_REDIS_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  WORKER_RESULT_REDIS: "redis://redis:6379/2"
  INFLUX_URL: "http://influxdb:8086"
  INFLUX_TOKEN: "dev-token"
  INFLUX_ORG: "dev-org"
  INFLUX_BUCKET: "dev-bucket"
  K8S_DEFAULT_NAMESPACE: "djproj"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: djproj-web, namespace: djproj, labels: { app: djproj-web } }
spec:
  replicas: 1
  selector: { matchLabels: { app: djproj-web } }
  template:
    metadata: { labels: { app: djproj-web } }
    spec:
      containers:
        - name: web
          image: djproj-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CELERY_BROKER_URL
              valueFrom: { secretKeyRef: { name: rabbitmq-conn, key: broker_url } }
            - name: DJANGO_SECRET_KEY
              value: change-me
          envFrom: [ { configMapRef: { name: djproj-env } } ]
          ports: [ { containerPort: 8000 } ]
---
apiVersion: v1
kind: Service
metadata: { name: djproj-web, namespace: djproj }
spec:
  selector: { app: djproj-web }
  ports: [ { name: http, port: 80, targetPort: 8000 } ]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: djproj-worker, namespace: djproj, labels: { app: djproj-worker } }
spec:
  replicas: 0
  selector: { matchLabels: { app: djproj-worker } }
  template:
    metadata: { labels: { app: djproj-worker } }
    spec:
      containers:
        - name: worker
          image: djproj-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CELERY_BROKER_URL
              valueFrom: { secretKeyRef: { name: rabbitmq-conn, key: broker_url } }
            - name: TARGET_QUEUE_NAME
              value: "celery"
          envFrom: [ { configMapRef: { name: djproj-env } } ]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: djproj-worker, namespace: djproj }
spec:
  scaleTargetRef: { name: djproj-worker }
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 30
  triggers:
    - type: rabbitmq
      metadata:
        queueName: celery
        mode: QueueLength
        value: "1"
        hostFromEnv: CELERY_BROKER_URL
