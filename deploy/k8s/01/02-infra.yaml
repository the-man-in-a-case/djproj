---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: hez
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - { containerPort: 5672, name: amqp }
        - { containerPort: 15672, name: management }
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: "admin" }
        - { name: RABBITMQ_DEFAULT_PASS, value: "password" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hez
spec:
  selector: { app: rabbitmq }
  ports:
  - { name: amqp, port: 5672, targetPort: 5672 }
  - { name: http, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hez
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - { containerPort: 6379, name: redis }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hez
spec:
  selector: { app: redis }
  ports:
  - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: hez
spec:
  replicas: 1
  selector: { matchLabels: { app: influxdb } }
  template:
    metadata: { labels: { app: influxdb } }
    spec:
      containers:
      - name: influxdb
        image: influxdb:2.7
        ports:
        - { containerPort: 8086, name: http }
        env:
        - { name: DOCKER_INFLUXDB_INIT_MODE, value: "setup" }
        - { name: DOCKER_INFLUXDB_INIT_USERNAME, value: "admin" }
        - { name: DOCKER_INFLUXDB_INIT_PASSWORD, value: "password" }
        - { name: DOCKER_INFLUXDB_INIT_ORG, valueFrom: { configMapKeyRef: { name: app-env, key: INFLUX_ORG } } }
        - { name: DOCKER_INFLUXDB_INIT_BUCKET, valueFrom: { configMapKeyRef: { name: app-env, key: INFLUX_BUCKET } } }
        - { name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN, valueFrom: { configMapKeyRef: { name: app-env, key: INFLUX_TOKEN } } }
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: hez
spec:
  selector: { app: influxdb }
  ports:
  - { name: http, port: 8086, targetPort: 8086 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: hez
spec:
  replicas: 1
  selector: { matchLabels: { app: django-app } }
  template:
    metadata: { labels: { app: django-app } }
    spec:
      containers:
      - name: app
        image: dkci-backend:1.1
        imagePullPolicy: IfNotPresent
        ports:
        - { containerPort: 8000, name: http }
        envFrom:
        - configMapRef: { name: app-env }
        # readinessProbe:
        #   httpGet: { path: /, port: 8000 }
        #   periodSeconds: 10
        #   initialDelaySeconds: 10
        # livenessProbe:
        #   httpGet: { path: /admin/login/, port: 8000 }
        #   periodSeconds: 20
        #   initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: django-app
  namespace: hez
spec:
  selector: { app: django-app }
  type: NodePort
  ports:
  - { name: http, port: 8000, targetPort: 8000, nodePort: 30080 }
